ROUTER_IP=192.168.1.1
USERNAME='admin'
PASSWORD='PassWord'

# Leave empty to let the script auto-detect the modem:
MODEM_ID=''

# RUTX routers usually present a self-signed HTTPS certificate:
INSECURE='1'

CONNECT_TIMEOUT='5'
MAX_TIME='20'

RETRIES='3'
BACKOFF_BASE='2'

# Deliberately left at 1.
# Automatically retrying the SMS request can result in a duplicate SMS.
SMS_RETRIES='1'

SYSLOG_TAG='teltonika-sms'
QUIET='0'
